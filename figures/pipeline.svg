<text x="54" y="25" font-size="17" font-weight="700" fill="#1f2937">Loss</text>
<text x="224" y="25" font-size="15" fill="#4b5563">loss only</text>
<text x="490" y="25" font-size="17" font-weight="700" fill="#24415f" text-anchor="end">LDP · GOF 4</text></g>
<g transform="translate(36,436)"><rect width="506" height="36" rx="9" fill="#fff" stroke="#d1d5db"/><rect width="40" height="36" rx="9" fill="#b5651d"/>
<text x="20" y="25" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">C</text>
<text x="54" y="25" font-size="17" font-weight="700" fill="#1f2937">Latency</text>
<text x="224" y="25" font-size="15" fill="#4b5563">delay only</text>
<text x="490" y="25" font-size="17" font-weight="700" fill="#24415f" text-anchor="end">LDP · GOF 4</text></g>
<g transform="translate(36,480)"><rect width="506" height="36" rx="9" fill="#fff" stroke="#d1d5db"/><rect width="40" height="36" rx="9" fill="#8a3b12"/>
<text x="20" y="25" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">D</text>
<text x="54" y="25" font-size="17" font-weight="700" fill="#1f2937">Loss + latency</text>
<text x="224" y="25" font-size="15" fill="#4b5563">both</text>
<text x="490" y="25" font-size="17" font-weight="700" fill="#24415f" text-anchor="end">LDP · GOF 4</text></g>
<g transform="translate(598,348)"><rect width="398" height="168" rx="12" fill="#fff" stroke="#c7d3e3"/>
<text x="18" y="30" font-size="17" font-weight="700" fill="#24415f">Design</text>
<text x="18" y="56" font-size="15" fill="#4b5563">Slices B, C, D form a 2×2 factorial on loss and</text>
<text x="18" y="77" font-size="15" fill="#4b5563">latency at a fixed encoder (LDP, GOF 4); Slice A</text>
<text x="18" y="98" font-size="15" fill="#4b5563">anchors the clean ceiling. Stage 2 is identical</text>
<text x="18" y="119" font-size="15" fill="#4b5563">in every condition, so any MOS difference</text>
<text x="18" y="140" font-size="15" fill="#4b5563">originates in the Stage 1 path, and ψ is measured</text>
<text x="18" y="161" font-size="15" fill="#4b5563">from the renderer's per-GOF deadline telemetry.</text>
</g>
<text x="1050" y="372" font-size="15" fill="#4b5563">ITU-T P.910 ACR</text>
<text x="1050" y="393" font-size="15" fill="#4b5563">N = 50 participants</text>
<text x="1050" y="414" font-size="15" fill="#4b5563">rated attribute:</text>
<text x="1050" y="435" font-size="15" fill="#4b5563">playback smoothness</text>
