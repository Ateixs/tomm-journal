<g transform="translate(36,348)"><rect width="506" height="36" rx="9" fill="#fff" stroke="#d1d5db"/><rect width="40" height="36" rx="9" fill="#24415f"/>
<text x="20" y="25" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<text x="54" y="25" font-size="17" font-weight="700" fill="#1f2937">Clean</text>
<text x="224" y="25" font-size="15" fill="#4b5563">no loss, no delay</text>
<text x="490" y="25" font-size="17" font-weight="700" fill="#24415f" text-anchor="end">RA · GOF 32</text></g>
<g transform="translate(36,392)"><rect width="506" height="36" rx="9" fill="#fff" stroke="#d1d5db"/><rect width="40" height="36" rx="9" fill="#b5651d"/>
